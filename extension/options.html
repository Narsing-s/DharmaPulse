<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DharmaPulse Settings</title><style>body{margin:0;background:#f8f2e8;color:#33271f;font:15px/1.6 system-ui}.wrap{max-width:620px;margin:50px auto;padding:28px;background:#fff;border-radius:24px;box-shadow:0 15px 50px #5b371418}h1{font:32px Georgia}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid #eadcca}input[type=time]{padding:10px;border:1px solid #d9c6b0;border-radius:10px}button{margin-top:18px;border:0;border-radius:12px;padding:11px 18px;background:#6f4322;color:#fff;font-weight:700}a{color:#6f4322}</style></head><body><main class="wrap"><h1>ॐ DharmaPulse</h1><p>Configure your daily devotional reminder. Preferences stay in Chrome extension storage.</p><div class="row"><label for="enabled">Daily reminder</label><input id="enabled" type="checkbox"></div><div class="row"><label for="time">Reminder time</label><input id="time" type="time" value="07:00"></div><button id="save">Save settings</button><p id="status" role="status"></p><p><a href="https://github.com/Narsing-s/DharmaPulse" target="_blank" rel="noreferrer">DharmaPulse project</a></p></main><script src="options.js"></script></body></html>
