name: DharmaPulse Chrome Extension Package
on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
      - "public/content.json"
      - ".github/workflows/chrome-extension-package.yml"
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare extension package
        run: |
          rm -rf dist-chrome
          mkdir -p dist-chrome/icons
          cp chrome-extension/manifest.json dist-chrome/
          cp chrome-extension/popup.html chrome-extension/popup.css chrome-extension/popup.js dist-chrome/
          cp chrome-extension/background.js chrome-extension/options.html chrome-extension/options.css chrome-extension/options.js dist-chrome/
          cp chrome-extension/store-listing.md dist-chrome/
          cp public/content.json dist-chrome/content.json
          cp chrome-extension/icons/icon-16.png chrome-extension/icons/icon-16.png 2>/dev/null || true
          cp chrome-extension/icons/icon-48.png dist-chrome/icons/icon-48.png
          cp chrome-extension/icons/icon-128.png dist-chrome/icons/icon-128.png
          cp chrome-extension/icons/icon-16.png dist-chrome/icons/icon-16.png
      - name: Validate manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist-chrome/manifest.json','utf8'));if(m.manifest_version!==3)process.exit(1);if(!/^\d+\.\d+\.\d+$/.test(m.version))process.exit(1);console.log(m.name,m.version)"
      - name: Validate package files
        run: |
          test -f dist-chrome/icons/icon-16.png
          test -f dist-chrome/icons/icon-48.png
          test -f dist-chrome/icons/icon-128.png
          test -f dist-chrome/content.json
          node --check dist-chrome/background.js
          node --check dist-chrome/popup.js
          node --check dist-chrome/options.js
      - name: Create Web Store ZIP
        run: |
          cd dist-chrome
          zip -r ../DharmaPulse-Chrome-WebStore-v1.3.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DharmaPulse-Chrome-WebStore-v1.3.0
          path: DharmaPulse-Chrome-WebStore-v1.3.0.zip
