<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DharmaPulse</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="brand"><span class="om">ॐ</span><div><h1>DharmaPulse</h1><p id="date"></p></div></div><button id="refresh" class="icon-btn" aria-label="Show another blessing" title="New blessing">↻</button></header>
<main>
<section class="hero"><div class="deity-row"><img id="deityImage" class="deity-image" src="icons/icon-128.png" alt="Deity"><div><p class="eyebrow">TODAY'S DEITY</p><h2 id="deity"></h2><p id="deityTelugu" class="muted"></p></div></div>
<blockquote id="message"></blockquote><div class="chips"><span id="mantra"></span><span id="category">Daily Dharma</span></div><p id="wisdom" class="wisdom"></p>
<div class="actions"><button id="save" class="primary">♡ Save</button><button id="open" class="secondary">Open DharmaPulse</button></div></section>
<section class="reminder"><div><strong>Daily reminder</strong><p id="reminderStatus">Checking…</p></div><button id="reminder" class="secondary">Enable 7:00 AM</button></section>
<p id="status" class="status" role="status"></p>
</main>
<footer><a href="options.html">Settings</a><span>•</span><a href="https://narsing-s.github.io/DharmaPulse/" target="_blank">Web app</a></footer>
<script src="popup.js"></script>
</body></html>
